name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Release builds are manual on purpose: producing installers is not the same
  # as publishing them, and no upload step runs automatically.
  workflow_dispatch:
jobs:
  secret:
    # Full-history scan. Known synthetic fixtures are pinned in .gitleaksignore
    # so a newly introduced real credential fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      JWT_SECRET: ci-only-secret-value-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/index.js & sleep 2 && curl -sf http://127.0.0.1:3001/health && curl -sf http://127.0.0.1:3001/ready

  fullstack:
    # Real Fastify API + SQLite + Vite, so auth and project flows get a PR gate.
    # The startup script owns its own ports and SQLite file.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npx playwright install --with-deps chromium
      - name: full-stack end-to-end
        run: npm run test:e2e:full
      - name: keep failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-e2e-failure
          path: |
            test-results
            playwright-report
          retention-days: 7

  desktop:
    # Electron needs a display server; xvfb provides one for the E2E run.
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-value-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm --prefix desktop ci
      - name: cache electron binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: desktop typecheck and unit tests
        run: npm run desktop:test
      - name: build renderer, api and electron main
        run: |
          npm run build
          npm run server:build
          npm --prefix desktop run build
      - name: stage runtime payload (native module built for the electron ABI)
        run: npm --prefix desktop run stage
      - run: npx playwright install --with-deps chromium
      - name: electron end-to-end
        env:
          WHATIF_E2E_NO_SANDBOX: "1"
        run: xvfb-run --auto-servernum npx playwright test --config=playwright.desktop.config.ts
      - name: keep failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-failure
          path: |
            test-results
            playwright-report
          retention-days: 7

  release:
    # Manual only. Secrets are referenced by name; none are stored in the repo.
    # When unset, electron-builder simply skips signing/notarisation and the
    # job still produces unsigned artifacts for local verification.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm --prefix desktop ci
      - name: build signed installers
        run: npm run desktop:dist
      - name: keep installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml
          if-no-files-found: warn
          retention-days: 14
